services:
  - type: web
    name: neaw-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neaw-db
          property: connectionString

  - type: web
    name: neaw-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://neaw-backend.onrender.com

databases:
  - name: neaw-db
    plan: free
    databaseName: neaw
    user: neaw